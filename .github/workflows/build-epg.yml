
name: Build and publish EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Build combined EPG
        run: python build_epg.py


      - name: Publish EPG as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest EPG
          body: Automatically generated EPG file.
          files: public/epg.xml.gz
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

